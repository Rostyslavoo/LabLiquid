name: test
on:  push
jobs:
  main:
    runs-on: ubuntu-latest
    steps: 
      - name: Install Jupyter
        run: python3 -m pip install jupyter nbformat nbclient
      - run: python -c "print('hello')"
      - uses: actions/checkout@v7
      - uses: quarto-dev/quarto-actions/setup@v2
        with: 
          tinytex: true
      - run: quarto render test.ipynb --execute --to pdf
      - uses: actions/upload-artifact@v7
        with:
          path: test.pdf
          archive: false
